apis:
- name: Prime Labs Storefront Agent API (UCP / MCP)
  description: >-
    Anonymous agent-commerce surface for the Prime Labs supplement storefront, implementing the
    Universal Commerce Protocol 2026-04-08 over MCP. Thirteen tools cover catalog search, product
    lookup, cart lifecycle, checkout lifecycle and order retrieval; complete_checkout requires an
    idempotency key and contemporaneous buyer approval. Read-only product and collection JSON is
    also available without authentication.
  humanURL: https://primelabs.org/agents.md
  baseURL: https://primelabs.org/api/ucp/mcp

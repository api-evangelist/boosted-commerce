aid: boosted-commerce
name: Boosted Commerce
description: >-
  Boosted Commerce is a Los Angeles based consumer brand platform that acquires and operates
  direct-to-consumer and Amazon FBA businesses in health, wellness, beauty and longevity. Founded
  by Keith Richman and Charlie Chanaratsopon, the company runs a portfolio of supplement and
  skincare brands — Prime Labs, Vital Vitamins, Happy Healthy Hippie and Asterwood — and is
  expanding those brands from marketplace and DTC channels into national retail with EDI-ready
  vendor operations. Boosted Commerce publishes no first-party developer program of its own, but
  every brand storefront runs on Shopify and serves a live, anonymous agent-commerce surface:
  a Universal Commerce Protocol (UCP) merchant profile at /.well-known/ucp, agent instructions at
  /llms.txt and /agents.md, and a Model Context Protocol endpoint at /api/ucp/mcp exposing 13
  catalog, cart, checkout and order tools with published JSON Schema inputs.

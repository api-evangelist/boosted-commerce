    POST /api/ucp/mcp with method "tools/list" returned HTTP 200 and a JSON-RPC 2.0 result containing
    13 tools, each with a name, description and inputSchema.
- id: jsonrpc-2.0
  name: JSON-RPC 2.0
  conforms: true
  evidence: >-
    Both success and error responses carry "jsonrpc":"2.0" plus the matching request id; errors use
    the standard {code, message, data} error object.
- id: json-schema-2020-12
  name: JSON Schema draft 2020-12
  conforms: true
  evidence: >-

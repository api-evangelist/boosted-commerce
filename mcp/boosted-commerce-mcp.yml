note: >-
  Live, anonymous MCP endpoint. `tools/list` was called over JSON-RPC 2.0 with no credentials and
  returned HTTP 200 with 13 tools and full JSON Schema (draft 2020-12) inputSchemas. The verbatim
  response is saved at mcp/boosted-commerce-ucp-tools-list.json. All four Boosted Commerce brand
  storefronts returned a byte-identical tool set — the server is provided by the Shopify platform
  as its Universal Commerce Protocol (UCP) shopping service, deployed on each brand's own host and
  operating over that brand's own catalog. This is a platform-supplied surface, not a first-party
  Boosted Commerce engineering artifact; it is recorded here because it is genuinely served from
  hosts Boosted Commerce owns and is callable by agents today.

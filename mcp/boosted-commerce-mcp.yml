tools:
- name: search_catalog
  category: catalog
  description: >-
    Search for products from the online store using natural language queries, filter criteria, or
    both. At least one of query or filters must be provided. Results are cursor-paginated.
  required: [meta, catalog]
- name: lookup_catalog
  category: catalog
  description: >-
    Look up multiple products or variants by identifier (gid://shopify/Product/... or
    gid://shopify/ProductVariant/...) in a single request. Results are grouped by product.
  required: [meta, catalog]
- name: get_product
  category: catalog
  description: >-
    Retrieve complete product detail by identifier — variants, exact pricing, real-time
    availability, and interactive option selection for variant narrowing.
  required: [meta, catalog]
- name: create_cart
  category: cart
  description: Creates a new cart.
  required: [meta, cart]
- name: get_cart
  category: cart
  description: Get the cart contents.
  required: [meta, id]
- name: update_cart
  category: cart
  description: Perform updates to a cart.
  required: [meta, cart, id]
- name: cancel_cart
  category: cart
  description: Cancels a cart.
  required: [meta, id]
- name: create_checkout
  category: checkout
  description: >-
    Creates a checkout. Returns checkout details, including line items, totals, and any applicable
    discounts or taxes.
  required: [meta, checkout]
- name: get_checkout
  category: checkout
  description: >-
    Returns details about the checkout, including line items, totals, and any applicable discounts
    or taxes.
  required: [meta, id]
- name: update_checkout
  category: checkout
  description: Updates a checkout — used to set shipping address and fulfillment method.
  required: [meta, checkout, id]
- name: complete_checkout
  category: checkout
  description: >-
    Completes a checkout and returns the result, including order ID and Thank You Page URL. Requires
    meta.idempotency-key and explicit contemporaneous buyer approval of payment.
  required: [meta, id, checkout]
  idempotent: true
  idempotency_key: meta.idempotency-key
- name: cancel_checkout
  category: checkout
  description: Cancels a checkout.
  required: [meta, id]
- name: get_order
  category: order
  description: Get the details of an order.
  required: [meta, id]
